name: Expand NEPTCINY source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Safely extract project archive
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive_path = Path('neptciny-source.zip')
          if not archive_path.is_file():
              raise SystemExit('neptciny-source.zip not found')
          destination = Path('/tmp/neptciny-project').resolve()
          destination.mkdir(parents=True, exist_ok=True)
          with ZipFile(archive_path) as archive:
              for entry in archive.infolist():
                  target = (destination / entry.filename).resolve()
                  if target != destination and destination not in target.parents:
                      raise SystemExit(f'Unsafe path in archive: {entry.filename}')
              archive.extractall(destination)
          if not (destination / 'package.json').is_file():
              raise SystemExit('package.json missing from extracted project')
          PY
          cp -a /tmp/neptciny-project/. .

      - name: Commit expanded project files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Expand NEPTCINY source project'
            git push
          fi
